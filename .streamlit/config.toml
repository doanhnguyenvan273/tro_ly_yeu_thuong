[server]
headless = true
enableStaticServing = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 10

[runner]
fastReruns = true

[theme]
primaryColor = "#ff758c"
backgroundColor = "#fff5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#333333"
font = "sans serif"

[browser]
gatherUsageStats = false
